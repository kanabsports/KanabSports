<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit an Update | Kanab Sports</title><style>:root{--red:#e32636;--dark:#0b0c0f;--panel:#15171b;--line:#343740;--muted:#9da0a7}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f2;color:#111}.top{background:#0b0c0f;color:#fff;padding:20px}.wrap{width:min(760px,calc(100% - 28px));margin:auto}.brand{font-size:27px;font-weight:950;text-decoration:none;color:#fff}.brand:visited{color:#fff}.brand span{color:var(--red)}main{padding:48px 0 80px}.eyebrow{color:var(--red);font-weight:950;letter-spacing:1.6px;text-transform:uppercase;font-size:11px}h1{font-size:clamp(42px,9vw,72px);line-height:.92;letter-spacing:-3px;margin:10px 0 16px}.lead{font-size:17px;line-height:1.6;color:#666;max-width:650px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:28px 0}.choice{-webkit-appearance:none;appearance:none;border:1px solid #d8d8d4;background:#fff;color:#111;padding:16px;border-radius:12px;font:inherit;font-weight:900;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:var(--red);color:var(--red);outline:none}.choice.active,.choice.active:hover,.choice.active:focus-visible{background:var(--red);color:#fff;border-color:var(--red)}form{background:var(--dark);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:#c5c7cc}input,textarea{width:100%;border:1px solid var(--line);background:#17191f;color:#fff;border-radius:10px;padding:13px 14px;font:inherit}input:focus,textarea:focus{border-color:var(--red);outline:none}.submit{grid-column:1/-1;-webkit-appearance:none;appearance:none;border:0;background:var(--red);color:#fff;border-radius:10px;padding:15px;font:inherit;font-weight:950;letter-spacing:.8px;text-transform:uppercase}.status{grid-column:1/-1;color:#c6c8ce;min-height:22px}.hp{position:absolute;left:-9999px}.note{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:620px){.choices{grid-template-columns:1fr}.wrap{width:min(100% - 20px,760px)}form{grid-template-columns:1fr;padding:22px}.field,.full,.submit,.status{grid-column:1}}</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><header class="top"><div class="wrap"><a class="brand" href="/">KANAB <span>SPORTS</span></a></div></header><main class="wrap"><div class="eyebrow">Help keep Kanab Sports current</div><h1>Submit an Update</h1><p class="lead">Send us an event or correction. Nothing publishes automatically — Kanab Sports reviews every submission first.</p><div class="choices"><button class="choice active" type="button" data-type="Event">Submit an Event</button><button class="choice" type="button" data-type="Correction">Submit a Correction</button></div><form id="updateForm" action="/contact" method="post"><input type="hidden" name="source" value="Community"><input id="type" type="hidden" name="type" value="Event"><div class="hp"><label>Website<input name="website" autocomplete="off"></label></div><div class="field"><label>Your name<input name="name" required></label></div><div class="field"><label>Your email<input type="email" name="email" required></label></div><div class="field"><label>Team / Organization<input name="team"></label></div><div class="field"><label>Sport<input name="sport"></label></div><div class="field"><label>Date<input type="date" name="date"></label></div><div class="field"><label id="opponentLabel">Event name<input name="opponent"></label></div><div class="field full" id="resultField"><label id="resultLabel">Event information<input name="result"></label></div><div class="field full"><label>Official link, if available<input type="url" name="link" placeholder="https://..."></label></div><div class="field full"><label id="messageLabel">Event details<textarea name="message" required placeholder="Anything we should know..."></textarea></label></div><div class="field full"><div class="cf-turnstile" data-sitekey="0x4AAAAAAEaTA5LVEwUoh6DI" data-theme="dark"></div></div><button class="submit" type="submit">Send to Kanab Sports</button><div id="status" class="status"></div><div class="full note">Approved events can publish to Kanab Sports. Corrections are reviewed before we make any site changes.</div></form></main><script>const form=document.getElementById('updateForm'),type=document.getElementById('type'),status=document.getElementById('status'),opp=document.getElementById('opponentLabel'),resultField=document.getElementById('resultField'),msg=document.getElementById('messageLabel'),buttons=[...document.querySelectorAll('.choice')];function setType(value){const wanted=['Event','Correction'].includes(value)?value:'Event';type.value=wanted;buttons.forEach(b=>b.classList.toggle('active',b.dataset.type===wanted));if(wanted==='Event'){opp.firstChild.textContent='Event name';resultField.style.display='';msg.firstChild.textContent='Event details'}else{opp.firstChild.textContent='Page / Item to correct';resultField.style.display='none';msg.firstChild.textContent='What needs to be corrected?'}}buttons.forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));setType(new URLSearchParams(location.search).get('type')||'Event');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Sending…';const fd=new FormData(form);try{const r=await fetch('/contact',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not send update.');status.textContent='Thanks — your update was sent to Kanab Sports for review.';form.reset();setType('Event');try{turnstile.reset()}catch{}}catch(err){status.textContent=err.message||'Something went wrong. Please try again.'}});</script></body></html>
