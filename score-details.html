<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game stats · Coach Portal</title><link rel="stylesheet" href="/messages/messages.css"></head><body><header><a href="/coaches#quick-scores">← Scores</a></header><main><h1>Add game stats</h1><p>Choose a cropped MaxPreps box score. Check names, column headings and numbers against the picture before publishing.</p><form id="stats" hidden><label>Upload stats screenshot <input id="picture" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="preview" hidden alt="Selected stats screenshot" style="max-width:100%"><label>Game details and stats <textarea id="details" rows="12" maxlength="8000" required></textarea></label><small>Only this reviewed text will appear with the public score.</small><button id="save">Publish reviewed stats</button></form><p id="state" role="status">Checking game access…</p><a id="publicLink" hidden>View published game stats</a></main><script type="module" src="/assets/score-details.js"></script></body></html>
