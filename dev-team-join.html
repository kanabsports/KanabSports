<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Join Your Team · Kanab Sports Preview</title><link rel="stylesheet" href="/assets/portal-preview.css"></head><body><header><a class="brand" href="/">KANAB<span>SPORTS</span></a><span class="preview">TEST INVITATION</span></header><main><section class="panel join"><span class="eyebrow">YOU’RE INVITED</span><h1 id="team">Your Team</h1><p>This is a test signup. Use sample names. No team access or text subscription is created.</p><form class="stack" id="join"><label for="parent">Your Name</label><input id="parent" required maxlength="80"><label for="child">Your Child’s Name</label><input id="child" required maxlength="80"><button type="submit" class="primary">Preview Join Request</button></form><p id="result" role="status"></p></section></main><script>document.getElementById('team').textContent=(new URLSearchParams(location.search).get('team')||'Your Team').slice(0,100);document.getElementById('join').onsubmit=e=>{e.preventDefault();if(!document.getElementById('parent').value.trim()||!document.getElementById('child').value.trim())return;document.getElementById('join').hidden=true;document.getElementById('result').textContent='That’s the signup flow. In the live portal, your coach will receive a request to approve and link your child. This test did not send a request.'};</script></body></html>
