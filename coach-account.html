<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Account · Kanab Sports</title><style>:root{--r:#e32636;--d:#0b0c0f;--m:#73767d;--l:#dedfe2}*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#111;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:var(--d);color:#fff;padding:18px}.wrap{width:min(620px,calc(100% - 28px));margin:auto}.brand{font-size:24px;font-weight:950}.brand span{color:var(--r)}main{padding:50px 0}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:26px;margin-bottom:16px}.eyebrow{font-size:10px;color:var(--r);font-weight:950;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:42px;line-height:1;margin:8px 0 12px}h2{margin:0 0 10px}.muted{color:var(--m);line-height:1.5}.field{margin-top:15px}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d5d6d8;border-radius:9px;font:inherit}.button{margin-top:16px;border:0;background:var(--r);color:#fff;padding:13px 17px;border-radius:9px;font-weight:900;cursor:pointer}.secondary{background:#17191d}.status{min-height:22px;margin-top:12px;color:var(--m);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row .button{flex:1}</style></head><body><header class="top"><div class="wrap brand">KANAB <span>SPORTS</span></div></header><main class="wrap"><div class="eyebrow">Verified coaches</div><h1>Coach Account</h1><p class="muted">Set your own password once, then sign in normally. If you forget it, email yourself another 6-digit verification code.</p><section class="card"><h2>Set or reset your password</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><button id="send" class="button">Email me a 6-digit code</button><div class="field"><label>Verification code</label><input id="otp" inputmode="numeric" maxlength="6"></div><div class="field"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password"></div><button id="save" class="button secondary">Save password</button><div id="resetStatus" class="status"></div></section><section class="card"><h2>Sign in</h2><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="button">Sign in</button><div id="loginStatus" class="status"></div></section><div class="row"><a class="button secondary" href="/coaches.html" style="text-decoration:none;text-align:center">Submit a score</a><a class="button secondary" href="/coach-documents.html" style="text-decoration:none;text-align:center">Upload team info</a></div></main><script>const $=id=>document.getElementById(id);async function api(body){const r=await fetch('/api/coach-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();return{ok:r.ok,...d}}$('send').onclick=async()=>{$('resetStatus').textContent='Sending…';const d=await api({action:'request_otp',email:$('email').value});$('resetStatus').textContent=d.message||d.error};$('save').onclick=async()=>{$('resetStatus').textContent='Saving…';const d=await api({action:'set_password',email:$('email').value,otp:$('otp').value,password:$('newPassword').value});$('resetStatus').textContent=d.message||d.error};$('login').onclick=async()=>{$('loginStatus').textContent='Signing in…';const d=await api({action:'login',email:$('loginEmail').value,password:$('password').value});$('loginStatus').textContent=d.message||d.error;if(d.success)setTimeout(()=>location.href='/coaches.html',500)};</script></body></html>
