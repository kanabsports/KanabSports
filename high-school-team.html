<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team · Kanab Sports</title>
<style>:root{--red:#e32636;--ink:#111318;--paper:#f4f4f2;--line:#deded9;--muted:#747780}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:#0b0c0f;color:#fff;padding:18px 0}.wrap{width:min(1050px,calc(100% - 30px));margin:auto}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950;color:#fff;text-decoration:none}.brand span,.eyebrow{color:var(--red)}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:900}.hero{background:#fff;padding:46px 0;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:1.2px}h1{font-size:clamp(42px,8vw,72px);letter-spacing:-3px;line-height:.95;margin:9px 0}.next{font-size:17px;color:#555}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.stat{background:#111318;color:#fff;border-radius:12px;padding:17px}.stat b{display:block;font-size:22px}.stat span{font-size:10px;text-transform:uppercase;color:#aaa;font-weight:900}.content{padding:38px 0 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px}.panel h2{margin:0 0 17px}.game{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.game b{font-size:14px}.game span{color:var(--muted);font-size:13px}.empty{background:#f5f5f5;border-radius:11px;padding:18px;color:var(--muted);line-height:1.5}.source{display:inline-block;margin-top:16px;color:var(--red);font-weight:900;text-decoration:none}.note{white-space:pre-wrap}.sources{display:grid;gap:8px;margin-top:14px}.sources a{color:var(--red);font-weight:900;text-decoration:none}@media(max-width:700px){.content{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.game{grid-template-columns:75px 1fr}.game span:last-child{grid-column:2}}</style></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="/">KANAB <span>SPORTS</span></a><a class="back" href="/#sports">← Find a Sport</a></div></header><section class="hero"><div class="wrap"><div id="school" class="eyebrow">Kanab High School</div><h1 id="title">Team</h1><p id="next" class="next"></p><div id="stats" class="stats"></div></div></section><main class="wrap content"><section class="panel"><h2>Team information</h2><div id="schedule"></div></section><aside class="panel"><h2>Roster, schedule &amp; sources</h2><div id="roster" class="empty"></div><div id="sources" class="sources"></div><a class="source" href="https://khs.kanek12.org/athletics/">Official KHS athletics →</a></aside></main>
<script>
const qs=new URLSearchParams(location.search),key=(qs.get('sport')||'football').toLowerCase(),teamKey=(qs.get('team')||'').toLowerCase();
const fallback={football:{name:'Cowboys Football',next:'North Summit @ Kanab · Fri, Sept. 11 · 7:00 PM',games:[['Sept. 11','North Summit @ Kanab','7:00 PM']]},volleyball:{name:'Cowgirls Volleyball',next:'Grand County @ Kanab · Thu, Sept. 10 · 6:30 PM',games:[['Sept. 10','Grand County @ Kanab','6:30 PM']]},crosscountry:{name:'Cowboys & Cowgirls Cross Country',next:'Schedule update coming soon',games:[]},golf:{name:'Cowboys Golf',next:'Schedule update coming soon',games:[]}};
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function showFallback(){const t=fallback[key]||{name:key.replace(/-/g,' ').replace(/\b\w/g,m=>m.toUpperCase()),next:'Approved team information coming soon',games:[]};document.title=t.name+' · Kanab Sports';title.textContent=t.name;next.textContent=t.next;stats.innerHTML='<div class="stat"><b>—</b><span>Overall</span></div><div class="stat"><b>—</b><span>Region</span></div><div class="stat"><b>'+t.games.length+'</b><span>Games listed</span></div>';schedule.innerHTML=t.games.length?t.games.map(g=>'<div class="game"><b>'+esc(g[0])+'</b><b>'+esc(g[1])+'</b><span>'+esc(g[2])+'</span></div>').join(''):'<div class="empty">Schedule update coming soon.</div>';roster.textContent='Roster and player statistics will appear here when the coach provides an approved source.'}
async function load(){try{const r=await fetch('/api/public-teams',{cache:'no-store'}),d=await r.json(),teams=Array.isArray(d.teams)?d.teams:[];const t=teams.find(x=>x.key===key&&(!teamKey||x.teamKey===teamKey))||teams.find(x=>x.key===key);if(!t){showFallback();return}document.title=(t.name||t.sport)+' · Kanab Sports';title.textContent=t.name||t.sport;school.textContent=t.team||'Kanab Sports';next.textContent=t.season?'Season: '+t.season:'';stats.innerHTML='<div class="stat"><b>Approved</b><span>Status</span></div><div class="stat"><b>'+esc(t.season||'—')+'</b><span>Season</span></div><div class="stat"><b>'+esc(t.documentType||'Update')+'</b><span>Latest update</span></div>';schedule.innerHTML=t.notes?'<div class="empty note">'+esc(t.notes)+'</div>':'<div class="empty">Coach information is approved and live. Schedule details will appear here when provided.</div>';roster.textContent=t.hasPdf?'An approved PDF was submitted for this team.':'No PDF is currently attached to the latest approved update.';sources.innerHTML=(t.scheduleUrl?'<a href="'+esc(t.scheduleUrl)+'" target="_blank" rel="noopener">MaxPreps schedule →</a>':'')+(t.rosterUrl?'<a href="'+esc(t.rosterUrl)+'" target="_blank" rel="noopener">MaxPreps roster →</a>':'')}catch{showFallback()}}
load();
</script></body></html>
