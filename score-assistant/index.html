<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="pep-score-entry-version" content="2026-10-09-v2"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Score Assistant · Kanab Sports</title><style>
:root{--r:#e32636;--d:#0b0c0f;--m:#73767d;--l:#dfe2e5}*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font-family:Arial,sans-serif}.top{background:var(--d);color:white;padding:18px}.wrap{width:min(680px,calc(100% - 28px));margin:auto}.brand{font-weight:900;font-size:24px}.brand span{color:var(--r)}main{padding:46px 0 70px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:25px}.eyebrow{font-size:10px;color:var(--r);font-weight:900;text-transform:uppercase;letter-spacing:1.3px}h1{font-size:42px;line-height:1;margin:8px 0 10px}.muted{color:var(--m);line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #cfd2d6;border-radius:9px;font:inherit}.field textarea{min-height:105px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.button{margin-top:18px;border:0;border-radius:9px;background:var(--r);color:#fff;padding:14px 16px;font-weight:900;cursor:pointer;width:100%}.status{margin-top:12px;color:var(--m);min-height:22px}.mode{margin:16px 0;padding:13px;border-radius:10px;background:#f6f6f6;font-size:13px;line-height:1.45}.games{display:grid;gap:10px;margin-top:16px}.game{border:1px solid var(--l);border-radius:12px;padding:14px}.game-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.game strong{display:block}.game small{color:var(--m)}.scoreline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.scoreline input{width:64px;padding:10px;border:1px solid #cfd2d6;border-radius:9px;text-align:center;font-weight:900}.scoreline button{margin:0 0 0 auto;border:0;border-radius:9px;background:var(--r);color:#fff;padding:11px 14px;font-weight:900}.live{color:#16833a;font-weight:900;margin-top:10px}@media(max-width:600px){.row{grid-template-columns:1fr}h1{font-size:36px}}</style></head><body><header class="top"><div class="wrap brand">KANAB <span>SPORTS</span></div></header><main class="wrap"><section class="card"><div class="eyebrow">Score assistant</div><h1>Report a final score</h1><p id="context" class="muted">Checking your access…</p><div id="mode" class="mode" hidden></div><button id="accept" class="button" hidden>Accept score-only invitation</button><div id="games" class="games" hidden></div><form id="form" hidden><div class="row"><div class="field"><label>Date<input id="date" type="date" required></label></div><div class="field"><label>Opponent<input id="opponent" required></label></div></div><div class="field"><label>Final score<input id="result" placeholder="Kanab 3 — Beaver 1" required></label></div><div class="field"><label>Official link (optional)<input id="link" type="url" placeholder="https://…"></label></div><div class="field"><label>Note (optional)<textarea id="details" placeholder="Anything the coach should know?"></textarea></label></div><button class="button">Submit final score</button><div id="status" class="status"></div></form></section></main><script>
const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),status=document.getElementById('status'),ctx=document.getElementById('context'),mode=document.getElementById('mode');
const games=document.getElementById('games');let state=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function submitScore(game,us,them,button){button.disabled=true;button.textContent='Submitting…';try{const r=await fetch('/api/score-assistant-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,date:game.date,opponent:game.opponent,result:us+'-'+them,link:'',details:'Final score submitted from uploaded schedule.'})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Could not submit.');alert(d.message);await load();}catch(err){alert(err.message||'Could not submit.');button.disabled=false;button.textContent='Submit'} }
function renderGames(){if(!state.games?.length){games.hidden=true;form.hidden=false;return}games.hidden=false;form.hidden=true;games.innerHTML=state.games.map((g,i)=>{const day=new Date(g.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});if(g.status==='live')return '<div class="game"><div class="game-top"><div><strong>'+day+' · '+esc(g.opponent)+'</strong><small>'+esc(g.time||'')+(g.site?' · '+esc(g.site):'')+'</small></div></div><div class="live">'+esc(g.result)+'</div></div>';return '<div class="game" data-game="'+i+'"><div class="game-top"><div><strong>'+day+' · '+esc(g.opponent)+'</strong><small>'+esc(g.time||'')+(g.site?' · '+esc(g.site):'')+'</small></div></div><div class="scoreline"><b>'+esc(state.coach.organization)+'</b><input inputmode="numeric" pattern="[0-9]*" data-us aria-label="'+esc(state.coach.organization)+' score"><b>'+esc(g.opponent)+'</b><input inputmode="numeric" pattern="[0-9]*" data-them aria-label="'+esc(g.opponent)+' score"><button data-send="'+i+'">Submit</button></div></div>'}).join('');games.querySelectorAll('[data-send]').forEach(button=>button.onclick=()=>{const i=Number(button.dataset.send),row=games.querySelector('[data-game="'+i+'"]'),us=row.querySelector('[data-us]').value.trim(),them=row.querySelector('[data-them]').value.trim();if(!/^[0-9]+$/.test(us)||!/^[0-9]+$/.test(them)){alert('Enter both final scores.');return}submitScore(state.games[i],us,them,button)})}
async function load(){const r=await fetch('/api/score-assistant-submit?token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.success){ctx.textContent=d.error||'This link is not available.';games.hidden=true;form.hidden=true;return}state=d;document.getElementById('accept').hidden=d.assistant.status!=='sent';if(d.assistant.status==='sent'){ctx.textContent='You are invited by '+d.coach.name+' to report scores for '+d.coach.organization+'. This does not grant roster or messaging access.';form.hidden=true;games.hidden=true;return}ctx.textContent=d.assistant.name+' · '+d.coach.organization+' · '+d.coach.sport+' · Responsible coach: '+d.coach.name;mode.hidden=false;mode.textContent=d.assistant.trusted?'Your coach trusts your score reporting. A submitted final score will publish immediately under the coach’s responsibility.':'Your score will wait for the coach. Pep will text the coach an approval link before anything goes live.';renderGames()}
document.getElementById('accept').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{const r=await fetch('/api/score-assistant-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'accept'})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error);await load()}catch(err){ctx.textContent=err.message}finally{b.disabled=false}};form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Submitting…';const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('/api/score-assistant-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,date:document.getElementById('date').value,opponent:document.getElementById('opponent').value,result:document.getElementById('result').value,link:document.getElementById('link').value,details:document.getElementById('details').value})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Could not submit.');status.textContent=d.message;form.reset();}catch(err){status.textContent=err.message}finally{b.disabled=false}});load();</script></body></html>
