<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Score Assistant · Kanab Sports</title><style>
:root{--r:#e32636;--d:#0b0c0f;--m:#73767d;--l:#dfe2e5}*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font-family:Arial,sans-serif}.top{background:var(--d);color:white;padding:18px}.wrap{width:min(680px,calc(100% - 28px));margin:auto}.brand{font-weight:900;font-size:24px}.brand span{color:var(--r)}main{padding:46px 0 70px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:25px}.eyebrow{font-size:10px;color:var(--r);font-weight:900;text-transform:uppercase;letter-spacing:1.3px}h1{font-size:42px;line-height:1;margin:8px 0 10px}.muted{color:var(--m);line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #cfd2d6;border-radius:9px;font:inherit}.field textarea{min-height:105px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.button{margin-top:18px;border:0;border-radius:9px;background:var(--r);color:#fff;padding:14px 16px;font-weight:900;cursor:pointer;width:100%}.status{margin-top:12px;color:var(--m);min-height:22px}.mode{margin:16px 0;padding:13px;border-radius:10px;background:#f6f6f6;font-size:13px;line-height:1.45}@media(max-width:600px){.row{grid-template-columns:1fr}h1{font-size:36px}}</style></head><body><header class="top"><div class="wrap brand">KANAB <span>SPORTS</span></div></header><main class="wrap"><section class="card"><div class="eyebrow">Score assistant</div><h1>Report a final score</h1><p id="context" class="muted">Checking your access…</p><div id="mode" class="mode" hidden></div><form id="form" hidden><div class="row"><div class="field"><label>Date<input id="date" type="date" required></label></div><div class="field"><label>Opponent<input id="opponent" required></label></div></div><div class="field"><label>Final score<input id="result" placeholder="Kanab 3 — Beaver 1" required></label></div><div class="field"><label>Official link (optional)<input id="link" type="url" placeholder="https://…"></label></div><div class="field"><label>Note (optional)<textarea id="details" placeholder="Anything the coach should know?"></textarea></label></div><button class="button">Submit final score</button><div id="status" class="status"></div></form></section></main><script>
const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),status=document.getElementById('status'),ctx=document.getElementById('context'),mode=document.getElementById('mode');
async function load(){const r=await fetch('/api/score-assistant-submit?token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.success){ctx.textContent=d.error||'This link is not available.';return}ctx.textContent=d.assistant.name+' · '+d.coach.organization+' · '+d.coach.sport+' · Responsible coach: '+d.coach.name;mode.hidden=false;mode.textContent=d.assistant.trusted?'Your coach trusts your score reporting. A submitted final score will publish immediately under the coach’s responsibility.':'Your score will wait for the coach. Pep will text the coach an approval link before anything goes live.';form.hidden=false}
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Submitting…';const b=form.querySelector('button');b.disabled=true;try{const r=await fetch('/api/score-assistant-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,date:date.value,opponent:opponent.value,result:result.value,link:link.value,details:details.value})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Could not submit.');status.textContent=d.message;form.reset();}catch(err){status.textContent=err.message}finally{b.disabled=false}});load();</script></body></html>
