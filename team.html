<style>:root{--red:#e32636;--ink:#111318;--paper:#f4f4f2;--line:#deded9;--muted:#747780}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:#0b0c0f;color:#fff;padding:18px 0}.wrap{width:min(1050px,calc(100% - 30px));margin:auto}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950;color:#fff;text-decoration:none}.brand span,.eyebrow{color:var(--red)}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:900}.hero{background:#fff;padding:46px 0;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:1.2px}h1{font-size:clamp(42px,8vw,72px);letter-spacing:-3px;line-height:.95;margin:9px 0}.next{font-size:17px;color:#555}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.stat{background:#111318;color:#fff;border-radius:12px;padding:17px}.stat b{display:block;font-size:22px}.stat span{font-size:10px;text-transform:uppercase;color:#aaa;font-weight:900}.content{padding:38px 0 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px}.panel h2{margin:0 0 17px}.game{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.game b{font-size:14px}.game span{color:var(--muted);font-size:13px}.empty{background:#f5f5f5;border-radius:11px;padding:18px;color:var(--muted);line-height:1.5}.source{display:inline-block;margin-top:16px;color:var(--red);font-weight:900;text-decoration:none}.dev{background:#fff0f1;color:#a51420;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:950;text-transform:uppercase}@media(max-width:700px){.content{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.game{grid-template-columns:75px 1fr}.game span:last-child{grid-column:2}}
