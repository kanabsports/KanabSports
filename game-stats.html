<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game stats · Kanab Sports</title><link rel="stylesheet" href="/messages/messages.css"></head><body><header><a href="/">Kanab Sports</a></header><main><h1>Game stats</h1><h2 id="game"></h2><p id="result"></p><pre style="white-space:pre-wrap;overflow-wrap:anywhere" id="details">Loading…</pre></main><script type="module">
const id=new URLSearchParams(location.search).get('id');try{const r=await fetch('/api/score-details?public=1&id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw Error();document.querySelector('#game').textContent=d.team+' vs. '+d.opponent;document.querySelector('#result').textContent=d.event_date+' · Final '+d.result;document.querySelector('#details').textContent=d.details}catch{document.querySelector('#details').textContent='Game stats unavailable.'}
</script></body></html>
