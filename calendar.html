<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recreation Calendar · Kanab Sports</title><style>:root{--r:#e32636;--b:#090a0d;--p:#f2f2ef;--m:#6f727a}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}.top{background:var(--b);color:#fff;padding:20px}.wrap{width:min(850px,calc(100% - 30px));margin:auto}.brand{font-weight:950;font-size:21px}.brand span,.eyebrow{color:var(--r)}.hero{background:#15171c;color:#fff;padding:44px 0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}h1{font-size:clamp(40px,7vw,66px);line-height:.96;letter-spacing:-2.6px;margin:8px 0}.hero p{color:#c8cad0}.main{padding:34px 0}.card{background:#fff;border:1px solid #deded8;border-radius:17px;padding:27px}.details{white-space:pre-wrap;line-height:1.65}.meta{font-size:12px;color:var(--m);margin-top:22px}.back{display:inline-block;margin-top:18px;color:#111;font-weight:850}</style></head><body><header class="top"><div class="wrap brand">KANAB <span>SPORTS</span></div></header><section class="hero"><div class="wrap"><div class="eyebrow">Kanab City Recreation</div><h1 id="title">Loading calendar…</h1><p>Schedule and recreation information.</p></div></section><main class="main"><div class="wrap"><article class="card"><div id="details" class="details"></div><div id="meta" class="meta"></div></article><a class="back" href="/">← Back to Kanab Sports</a></div></main><script>const slug=new URLSearchParams(location.search).get('slug')||'';fetch('/api/rec-calendar?slug='+encodeURIComponent(slug),{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Calendar unavailable');document.title=d.calendar.title+' · Kanab Sports';document.getElementById('title').textContent=d.calendar.title;document.getElementById('details').textContent=d.calendar.details;document.getElementById('meta').textContent='Last updated '+new Date(d.calendar.updated_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}).catch(e=>{document.getElementById('title').textContent='Calendar unavailable';document.getElementById('details').textContent=e.message})</script></body></html>
